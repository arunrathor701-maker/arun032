<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Wealth Hub - Join Our Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="max-w-md mx-auto p-6">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600 uppercase">
                Affiliate Wealth Hub
            </h1>
        </header>

        <section class="mb-8">
            <h2 class="text-2xl font-bold mb-4 text-center">Demat, Savings Accounts & Loan Campaigns चलाएं और हर हफ्ते कमाएं!</h2>
            <p class="text-gray-400 text-center mb-6">Affiliate Wealth Hub टीम में जुड़िए और 100% गारंटेड कमीशन पाइए।</p>
            
            <div class="bg-blue-900/50 p-6 rounded-xl border border-blue-700 mb-6 shadow-lg">
                <h3 class="font-semibold text-lg mb-1 text-center">टीम में शामिल होने के लिए फॉर्म भरें</h3>
                <p class="text-xs text-gray-300 mb-5 text-center">सबमिट करते ही आप डायरेक्ट WhatsApp पर कनेक्ट हो जाएंगे</p>
                
                <form id="whatsappForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1" for="userName">आपका नाम (Full Name) *</label>
                        <input class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-green-500" type="text" id="userName" placeholder="अपना पूरा नाम लिखें" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1" for="userProfile">आप क्या करते हैं? (Profile) *</label>
                        <select class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-green-500" id="userProfile" required>
                            <option value="Student">Student</option>
                            <option value="Loan/DSA Agent">Loan/DSA Agent</option>
                            <option value="Field Sales Executive">Field Sales Executive</option>
                            <option value="Team Leader">Team Leader</option>
                            <option value="Job Seeker - Part time">Job Seeker - Part time</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1" for="userPhone">WhatsApp Number *</label>
                        <input class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-green-500" type="tel" id="userPhone" placeholder="अपना WhatsApp नंबर लिखें" required>
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-lg flex items-center justify-center transition-colors shadow-md text-base">
                        💬 CONNECT ON WHATSAPP
                    </button>
                </form>
            </div>
        </section>

        <footer class="text-center text-gray-500 text-sm">
            <p>&copy; 2026 Affiliate Wealth Hub. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.getElementById('whatsappForm').addEventListener('submit', function(event) {
            event.preventDefault();

            // Form values get karna
            const name = document.getElementById('userName').value.trim();
            const profile = document.getElementById('userProfile').value;
            const phone = document.getElementById('userPhone').value.trim();

            const whatsappNumber = "9516586381";

            // Professional & Attractive WhatsApp Message
            const message = `✨ *NEW TEAM JOINING ENQUIRY* ✨\n` +
                            `________________________________\n\n` +
                            `नमस्ते *Affiliate Wealth Hub* टीम! 👋\n` +
                            `मैं आपकी टीम से जुड़कर *Demat, Savings Accounts, Loans & Credit Card Campaigns* में काम करना चाहता/चाहती हूँ।\n\n` +
                            `📋 *मेरी डिटेल्स:*\n` +
                            `👤 *नाम:* ${name}\n` +
                            `💼 *प्रोफाइल:* ${profile}\n` +
                            `📞 *व्हाट्सएप नंबर:* ${phone}\n\n` +
                            `🚀 कृपया मुझे आगे की ऑनबोर्डिंग प्रक्रिया और काम की जानकारी WhatsApp पर साझा करें। धन्यवाद!`;

            // WhatsApp URL Direct Redirect
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

            window.location.href = whatsappUrl;
        });
    </script>
</body>
</html>
